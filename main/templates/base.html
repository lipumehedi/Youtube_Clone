<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}My App{% endblock %}</title>

    <!-- Font Awesome Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    {% block extra_css %}{% endblock %}

    <style>
        /* LOGO */
        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 2px 8px 10px;
        }

        .sidebar .menu-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
        }

        .sidebar .menu-btn:hover {
            background-color: #272727;
        }

        .sidebar  .logo {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .sidebar  .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 24px;
            padding: 0;
            background-color: #ff0000;
            color: #fff;
            font-size: 11px;
            border-radius: 6px;
        }

        .sidebar .logo-text {
            color: #fff;
            font-size: 19px;
            font-weight: bold;
            letter-spacing: -0.5px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>

    <!-- LEFT SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-logo">
            <button class="menu-btn" aria-label="Menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <a href="/" class="logo">
                <span class="logo-icon"><i class="fa-solid fa-play"></i></span>
                <span class="logo-text">LipuTube</span>
            </a>
        </div>

        <a href="/">Home</a>
        <a href="#">Shorts</a>
        <a href="#">Subscriptions</a>

    </aside>

    <!-- RIGHT SECTION -->

    <div class="right-section">

        <!-- TOP NAVBAR -->

        <header class="navbar">

            <!-- CENTERED SEARCH FORM -->

            <form class="search-container" action="#" method="get">

                <div class="search-box">

                    <input
                        type="search"
                        name="q"
                        placeholder="Search"
                        aria-label="Search"
                    >

                    <button
                        type="submit"
                        class="search-button"
                        aria-label="Submit search"
                    >
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>

                </div>

                <!-- MICROPHONE -->

                <button
                    type="button"
                    class="mic-button"
                    aria-label="Voice search"
                    title="Voice search"
                >
                    <i class="fa-solid fa-microphone"></i>
                </button>

            </form>

            <!-- RIGHT-ALIGNED ACTIONS -->

            <div class="navbar-actions">

                <button
                    type="button"
                    class="create-button"
                >
                    <i class="fa-solid fa-plus"></i>
                    <span>Create</span>
                </button>

                <button
                    type="button"
                    class="notification-button"
                    aria-label="Notifications"
                    title="Notifications"
                >
                    <i class="fa-regular fa-bell"></i>
                </button>

                <div
                    class="profile"
                    role="button"
                    tabindex="0"
                    aria-label="User profile"
                    title="User profile"
                >
                    M
                </div>

            </div>

        </header>

        <!-- DYNAMIC CONTENT AREA -->

        <main class="content">

            {% block content %}

            {% endblock %}

        </main>

    </div>

</body>
</html>
