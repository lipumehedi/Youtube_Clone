
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MyApp{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0e0e0e;
            color: white;
        }

        /* Top Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: #181818;
            border-bottom: 1px solid #303030;
            display: flex;
            align-items: center;
            padding: 0 15px;
            z-index: 100;
        }

        header h2 {
            font-size: 20px;
            margin: 0;
        }

        /* Left Sidebar */
        aside {
            position: fixed;
            top: 70px;
            left: 0;
            bottom: 0;
            width: 128px;
            background-color: #181818;
            border-right: 1px solid #303030;
            padding: 10px 8px;
        }

        aside nav a {
            display: block;
            color: #eeeeee;
            text-decoration: none;
            padding: 12px 7px;
            font-size: 12px;
            border-radius: 4px;
            margin-bottom: 4px;
        }

        aside nav a:hover {
            background-color: #303030;
        }

        /* Main Content */
        main {
            margin-left: 128px;
            padding: 82px 15px 20px;
            min-height: 100vh;
        }

        main h1 {
            font-size: 22px;
            margin: 0 0 3px;
        }

        main p {
            font-size: 12px;
            margin-top: 0;
        }

        @media (max-width: 500px) {
            aside {
                width: 110px;
            }

            main {
                margin-left: 110px;
                padding-left: 12px;
            }

            main h1 {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- Top Header -->
    <header>
        <h2>MyApp</h2>
    </header>

    <!-- Left Sidebar -->
    <aside>
        <nav>
            <a href="/">🏠 Home</a>
            <a href="#">🔎 Explore</a>
            <a href="#">📺 Subscriptions</a>
            <a href="#">◉ History</a>
            <a href="#">⚙ Settings</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main>
        {% block content %}
        <h1>Welcome to My Django App</h1>
        <p>This content starts 10% from the left and 8% from the top.</p>
        {% endblock %}
    </main>

</body>
</html>
